name: QNDXX Multi-platform Build

on:
  push:
    branches:
      - qndxx/qndxx
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qndxx-build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.50.0"
  GO_VERSION: "1.27.1"
  NDK_VERSION: "r28c"

jobs:
  android:
    name: Android APKs (3 ABIs + universal)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install Linux native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugins/rust_api/rust
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch CA certificates
        run: curl -fsSL --retry 3 https://curl.se/ca/cacert.pem -o core/Clash.Meta/component/ca/ca-certificates.crt
      - name: Resolve dependencies
        run: flutter pub get
      - name: Prepare QNDXX logo and native icons
        run: |
          dart run tool/prepare_qndxx_assets.dart
          dart run flutter_launcher_icons
      - name: Build split APKs (armeabi-v7a, arm64-v8a, x86_64)
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: dart tool/package.dart android --arch arm64 --arch armv7 --arch amd64 --arch universal --tag v6.6.6 --env pre --verbose
      - uses: actions/upload-artifact@v4
        with:
          name: QNDXX-Android-APKs
          path: dist/*.apk
          if-no-files-found: error

  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2022
            channel: stable
          - arch: arm64
            runner: windows-11-arm
            channel: master
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: git config --global core.longpaths true
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.channel }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Setup Rust on Windows ARM64
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://win.rustup.rs/aarch64' -OutFile rustup-init.exe
          .\rustup-init.exe -y --default-toolchain stable
          Add-Content $env:GITHUB_PATH "$env:USERPROFILE\.cargo\bin"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugins/rust_api/rust
      - name: Resolve dependencies
        run: flutter pub get
      - name: Prepare QNDXX logo and native icons
        run: |
          dart run tool/prepare_qndxx_assets.dart
          dart run flutter_launcher_icons
      - name: Build Windows
        run: dart tool/package.dart windows --arch ${{ matrix.arch == 'arm64' && 'arm64' || 'amd64' }} --tag v6.6.6 --env pre --verbose
      - uses: actions/upload-artifact@v4
        with:
          name: QNDXX-Windows-${{ matrix.arch }}
          path: dist/*windows*
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugins/rust_api/rust
      - name: Resolve dependencies
        run: flutter pub get
      - name: Prepare QNDXX logo and native icons
        run: |
          dart run tool/prepare_qndxx_assets.dart
          dart run flutter_launcher_icons
      - name: Setup Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app || sudo xcode-select -s /Applications/Xcode_26.2.app
          xcodebuild -version
      - name: Build macOS
        run: dart tool/package.dart macos --arch ${{ matrix.arch == 'arm64' && 'arm64' || 'amd64' }} --tag v6.6.6 --env pre --verbose
      - uses: actions/upload-artifact@v4
        with:
          name: QNDXX-macOS-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

  analyze:
    name: Flutter analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install Linux test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev
      - run: flutter pub get
      - name: Format QNDXX sources
        run: dart format lib/providers/actions/profiles.dart lib/xboard tool/prepare_qndxx_assets.dart
      - name: Commit resolved dependency lockfile
        if: github.ref == 'refs/heads/qndxx/qndxx'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f pubspec.lock lib/providers/actions/profiles.dart lib/xboard tool/prepare_qndxx_assets.dart
          if ! git diff --cached --quiet; then
            git commit -m "chore(qndxx): commit resolved dependency lockfile [skip ci]"
            git push origin "HEAD:refs/heads/qndxx/qndxx"
          fi
      - run: flutter analyze --no-fatal-infos
      - run: dart run tool/test.dart -- --reporter expanded
