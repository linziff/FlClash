name: QNDXX Multi-platform Build

on:
  push:
    branches:
      - qndxx/qndxx
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qndxx-build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.50.0"
  GO_VERSION: "1.27.1"
  NDK_VERSION: "r28c"

jobs:
  android:
    name: Android APKs (3 ABIs + universal)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch CA certificates
        run: curl -fsSL --retry 3 https://curl.se/ca/cacert.pem -o core/Clash.Meta/component/ca/ca-certificates.crt
      - name: Resolve dependencies
        run: flutter pub get
      - name: Build split APKs (armeabi-v7a, arm64-v8a, x86_64)
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: flutter build apk --release --split-per-abi --build-name=6.6.6 --build-number=666
      - name: Build universal APK
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: flutter build apk --release --build-name=6.6.6 --build-number=666
      - uses: actions/upload-artifact@v4
        with:
          name: QNDXX-Android-APKs
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            output_arch: x64
            runner: windows-2022
            channel: stable
          - arch: arm64
            output_arch: arm64
            runner: windows-11-arm
            channel: master
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.channel }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Build Windows
        run: flutter build windows --release --build-name=6.6.6 --build-number=666
      - uses: actions/upload-artifact@v4
        with:
          name: QNDXX-Windows-${{ matrix.arch }}
          path: build/windows/${{ matrix.output_arch }}/runner/Release/
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Build macOS
        run: flutter build macos --release --build-name=6.6.6 --build-number=666
      - uses: actions/upload-artifact@v4
        with:
          name: QNDXX-macOS-${{ matrix.arch }}
          path: build/macos/Build/Products/Release/
          if-no-files-found: error

  analyze:
    name: Flutter analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
