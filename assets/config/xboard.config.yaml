# QNDXX XBoard configuration
# Remote endpoint returns the Orange-compatible remote config JSON structure.
xboard:
  provider: QNDXX
  remote_config:
    sources:
      - name: qndxx-primary
        url: https://img.toufq.com/speed/blob/main/url/config.json
        priority: 100
        timeout_seconds: 15
    max_retries: 3
    timeout_seconds: 15
    retry_delay_seconds: 2
  customer_service:
    crisp_website_id: 92f20590-a75f-4b50-a521-6d5fc7a356dd
  app:
    title: 青年大学习
    website: 官网发布页：toufq.com
    logo_url: https://img.toufq.com/IMG/QNDXXLG.png
  subscription:
    prefer_encrypt: true
    # 填入与你的 XBoard 面板一致的解密密钥；加密订阅端点需要此值。
    decrypt_key: ""
  security:
    # 如后端反代配置了响应混淆前缀，请填写完全一致的前缀。
    obfuscation_prefix: ""
    user_agents:
      # 必须与面板/Caddy 端的 API 认证 User-Agent 保持一致。
      api_encrypted: "QNDXX/6.6.6"
      domain_racing_test: "QNDXX/6.6.6 (Domain Racing Test)"
  log:
    enabled: true
    level: info
    prefix: "[QNDXX]"
